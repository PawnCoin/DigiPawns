name: Android AAB

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/android-capacitor

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build unchanged web app
        run: npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Restore upload signing key
        env:
          DGP_UPLOAD_KEYSTORE_BASE64: ${{ secrets.DGP_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$DGP_UPLOAD_KEYSTORE_BASE64"
          echo "$DGP_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/digipawns-upload.jks

      - name: Build Play release AAB
        working-directory: android
        env:
          DGP_UPLOAD_STORE_FILE: digipawns-upload.jks
          DGP_UPLOAD_STORE_PASSWORD: ${{ secrets.DGP_UPLOAD_STORE_PASSWORD }}
          DGP_UPLOAD_KEY_ALIAS: ${{ secrets.DGP_UPLOAD_KEY_ALIAS }}
          DGP_UPLOAD_KEY_PASSWORD: ${{ secrets.DGP_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Verify release signing
        run: jarsigner -verify -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: digipawns-play-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
