name: Security CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  frontend:
    name: Frontend build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from the public registry
        run: npm ci --include=dev

      - name: Build frontend
        run: npm run build

      - name: Block critical dependency vulnerabilities
        run: npm audit --audit-level=critical

  contracts:
    name: Smart contract compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies from the public registry
        run: npm ci --include=dev

      - name: Compile contracts
        run: npm run compile

      - name: Validate V3 upgrade storage layout
        run: npm run storage:check

      - name: Run contract tests
        run: npm test

      - name: Block critical dependency vulnerabilities
        run: npm audit --audit-level=critical
