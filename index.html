<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/digipawns-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigiPawns - Digital Asset Pawn Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* ── Marquee animations ── */
      @keyframes marquee {
        0%   { transform: translateX(0%); }
        100% { transform: translateX(-100%); }
      }
      @keyframes marquee-reverse {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(0%); }
      }
      .animate-marquee         { animation: marquee 80s linear infinite; }
      .animate-marquee-reverse { animation: marquee-reverse 80s linear infinite; }
      .animate-marquee-fast    { animation: marquee 60s linear infinite; }

      /* ── Metallic gold shimmer ── */
      @keyframes gold-shimmer {
        0%   { background-position: 200% center; }
        100% { background-position: -200% center; }
      }

      /* Primary CTA buttons */
      .btn-metallic-gold {
        background: linear-gradient(
          105deg,
          #6B4A00 0%,
          #C8920E 15%,
          #F5D060 38%,
          #FFF0A0 50%,
          #F5D060 62%,
          #C8920E 85%,
          #6B4A00 100%
        );
        background-size: 300% 100%;
        animation: gold-shimmer 4s linear infinite;
        color: #0B1528 !important;
        font-weight: 800 !important;
        text-shadow: 0 1px 0 rgba(255,255,255,0.2);
        box-shadow:
          0 0 20px rgba(245, 208, 96, 0.35),
          0 0 6px  rgba(212, 160, 23, 0.25),
          inset 0 1px 0 rgba(255,255,255,0.25),
          inset 0 -1px 0 rgba(0,0,0,0.2);
        border: 1px solid rgba(255,220,80,0.3);
        transition: box-shadow 0.3s, transform 0.2s;
      }
      .btn-metallic-gold:hover {
        animation-duration: 1.2s;
        box-shadow:
          0 0 35px rgba(245, 208, 96, 0.55),
          0 0 12px rgba(212, 160, 23, 0.4),
          inset 0 1px 0 rgba(255,255,255,0.3),
          inset 0 -1px 0 rgba(0,0,0,0.2);
        transform: translateY(-1px) scale(1.02);
      }
      .btn-metallic-gold:active {
        transform: translateY(0px) scale(1.00);
      }

      /* Metallic gradient text */
      @keyframes text-shimmer {
        0%   { background-position: 150% center; }
        100% { background-position: -150% center; }
      }
      .text-metallic-gold {
        background: linear-gradient(
          105deg,
          #C8920E 0%,
          #F5D060 25%,
          #FFF0A0 50%,
          #F5D060 75%,
          #C8920E 100%
        );
        background-size: 250% 100%;
        animation: text-shimmer 5s linear infinite;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      /* Gold border glow pulse */
      @keyframes border-glow {
        0%, 100% { box-shadow: 0 0 8px  rgba(212,160,23,0.3); }
        50%       { box-shadow: 0 0 18px rgba(212,160,23,0.6); }
      }
      .border-glow-gold { animation: border-glow 3s ease-in-out infinite; }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              serif: ['"Playfair Display"', 'serif'],
            },
            colors: {
              'brand-gold':       '#D4A017',
              'brand-gold-dark':  '#B8860B',
              'brand-gold-light': '#F0C040',
              'brand-dark':       '#0B1528',
              'brand-navy':       '#0F1E35',
              'brand-gray':       '#0F1E35',
            },
            boxShadow: {
              'gold-glow': '0 0 20px rgba(245,208,96,0.4), 0 0 6px rgba(212,160,23,0.3)',
              'blue-glow': '0 0 20px rgba(245,208,96,0.4), 0 0 6px rgba(212,160,23,0.3)',
            }
          }
        }
      }
    </script>

}
